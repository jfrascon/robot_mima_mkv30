################################################################################
# Front 2D LiDAR is a Leuze RSL400.
################################################################################
front_lidar2d:
  enabled: true
  use_gravity: true
  always_on: true
  visualize: false
  update_rate: 20.0
  hor_fov_deg: {"min_angle": -90, "max_angle": 90}
  hor_res_deg: 0.05
  dist_span: {"min_dist": 0.1, "max_dist": 25.0}
  dist_res: 0.015
  gaussian_noise: {"mean": 0.0, "stddev": 0.01}
