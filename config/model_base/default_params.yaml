# Do not configure `use_sim_time` in this file. If set, it is overridden.
# The key `robot_prefix` can be used in this file.

/**/robot_state_publisher:
  ros__parameters:
    # Do not set `use_robot_description_topic` in this file, if set, it is overridden.
    # Do not set `frame_prefix` in this file, if set, it is overridden.
    publish_frequency: 20.0
    ignore_timestamp: false # If true, joint_state messages are accepted regardless of timestamp.

/**/ros_gz_bridge:
  ros__parameters:
    # Do not set `expand_gz_topic_names` in this file, if set, it is overridden.
    # Do not set `override_frame_id` in this file, if set, it is overridden.
    subscription_heartbeat: 1000
    override_timestamps_with_wall_time: false

/**/controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: "joint_state_broadcaster/JointStateBroadcaster"

    mima_controller:
      type: "mima_controller/MimaController"

    fork_trajectory_controller:
      type: "joint_trajectory_controller/JointTrajectoryController"

/**/joint_state_broadcaster:
  ros__parameters:
    frame_id: $(var robot_prefix)base_footprint_link

/**/mima_controller:
  ros__parameters:
    reference_timeout: 2.0
    base_frame_id: $(var robot_prefix)base_footprint_link
    odom_frame_id: $(var robot_prefix)odom
    enable_odom_tf: true
    front_steering: true
    use_stamped_vel: true
    open_loop: false
    reduce_wheel_speed_until_steering_reached: true
    velocity_rolling_window_size: 10
    position_feedback: false
    rear_wheels_names:
    - $(var robot_prefix)rear_right_wheel_rotation_joint
    - $(var robot_prefix)rear_left_wheel_rotation_joint
    front_wheels_names:
    - $(var robot_prefix)front_right_wheel_steering_joint
    - $(var robot_prefix)front_left_wheel_steering_joint
    wheelbase: 1.7
    front_wheel_track: 0.78
    rear_wheel_track: 1.1
    front_wheels_radius: 0.2285
    rear_wheels_radius: 0.2795

/**/fork_trajectory_controller:
  ros__parameters:
    joints:
    - $(var robot_prefix)fork_mast_joint
    - $(var robot_prefix)fork_holder_joint
    - $(var robot_prefix)fork_board_joint

    command_interfaces:
    - position

    state_interfaces:
    - position
