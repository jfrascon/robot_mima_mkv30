  description: "Use the collision element for front_lidar2d."
  choices: ["True", "true", "False", "false"]
front_lidar2d_use_v_mesh:
  default_value: "True"
  description: "Use the visual mesh for front_lidar2d when the macro supports a visual mesh."
  choices: ["True", "true", "False", "false"]
front_lidar2d_v_mesh_use_low_res:
  default_value: "True"
  description: "Use the low-resolution visual mesh for front_lidar2d when a visual mesh is enabled."
  choices: ["True", "true", "False", "false"]
front_lidar2d_use_c_mesh:
  default_value: "False"
  description: "Use the collision mesh for front_lidar2d when the macro supports a collision mesh."
  choices: ["True", "true", "False", "false"]
front_lidar2d_c_mesh_use_low_res:
